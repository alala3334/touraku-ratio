<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日経225 PER</title>
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
<main>
  <nav class="tabs"><a href="./">騰落レシオ</a><a href="sinyou.html">信用残</a><a href="saitei.html">裁定残</a><a href="per.html" aria-current="page">PER</a><a href="pbr.html">PBR</a><a href="kokusai.html">国債金利</a></nav>
  <header>
    <h1>日経225 PER</h1>
    <p>株価収益率（日次） · 出典 <a href="https://nikkei225jp.com/data/per.php" target="_blank" rel="noopener">nikkei225jp.com</a> · 最終更新 <span id="updated">-</span></p>
  </header>

  <section class="tiles" id="tiles"></section>
  <p id="error"></p>

  <section class="card">
    <div class="controls">
      <div class="seg" id="basis" role="group" aria-label="計算方法" hidden>
        <button data-b="w" aria-pressed="true">加重平均</button><button data-b="i">指数ベース</button>
      </div>
      <div class="seg" id="range" role="group" aria-label="表示期間">
        <button data-m="3">3カ月</button><button data-m="12">1年</button><button data-m="36" aria-pressed="true">3年</button><button data-m="60">5年</button><button data-m="120">10年</button><button data-m="0">全期間</button>
      </div>
    </div>
    <div class="readout" id="readout"></div>
    <div id="charts"></div>
    <p class="note">「加重平均」は日経新聞などで広く使われる値、「指数ベース」は指数の計算方法に合わせた値です。 PER 14〜16倍が適正水準の目安とされます（加重平均）。</p>
  </section>

  <section class="card">
    <div class="row-head">
      <h2>日次データ</h2>
      <span class="legend-note"><span class="chip" style="background:#d63b3a;color:#fff;font-weight:700">16倍超 割高圏</span><span class="chip" style="background:#2a6fd0;color:#fff;font-weight:700">14倍未満 割安圏</span><span>（加重平均）</span></span>
      <a href="data/valuation.csv" download>CSV をダウンロード</a>
    </div>
    <div class="table-wrap"><table id="table"></table></div>
    <p><button id="showAll" class="more" hidden>すべての日を表示</button></p>
  </section>
</main>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="assets/common.js?v=5"></script>
<script src="assets/valuation.js?v=5"></script>
<script>
// 目安は加重平均の PER に対するもの（指数ベースは水準が違うので色分けしない）
const perState = (v, b = 'w') => v == null || b !== 'w' ? null : v > 16 ? ['hot', '割高圏'] : v < 14 ? ['cold', '割安圏'] : ['mid', '適正水準'];
const per = (r, b) => r['per_' + b];
const eps = (r, b) => r.nikkei && r['per_' + b] ? r.nikkei / r['per_' + b] : null;
renderValuationPage({
  basisToggle: true,
  state: (r, b) => perState(per(r, b), b),
  charts: [
    { id: 'perChart', title: 'PER（倍）<span class="basis-name"></span>', note: '点線: 16 / 14 倍（加重平均での目安）', height: 280, digits: 2,
      lines: [{ label: 'PER', unit: '倍', color: '--series-1', width: 2, value: per }], refs: [{ v: 16, color: '--hot' }, { v: 14, color: '--cold' }] },
    { id: 'epsChart', title: 'EPS（円）= 日経225 ÷ PER<span class="basis-name"></span>', height: 160, digits: 0,
      lines: [{ label: 'EPS', unit: '円', color: '--series-3', value: eps }] },
    { id: 'nikkeiChart', title: '日経225 終値', height: 160, digits: 0,
      lines: [{ label: '日経', color: '--nikkei', value: r => r.nikkei }] },
  ],
  tiles: (last, prev, b, tile) => {
    const st = perState(per(last, b), b);
    const d = per(last, b) - per(prev, b);
    return tile(`PER（${BASIS[b]}）`, `${fmt(per(last, b))}<small>倍</small>${st ? `<span class="badge ${st[0]}">${st[1]}</span>` : ''}`, `${last.date} · 前日比 ${(d >= 0 ? '+' : '') + fmt(d)}`, true) +
      tile('EPS（1株利益）', `${fmt(eps(last, b), 0)}<small>円</small>`, '日経225 ÷ PER') +
      tile('益回り', `${fmt(100 / per(last, b))}<small>%</small>`, '1 ÷ PER') +
      tile('配当利回り', `${fmt(last['div_' + b])}<small>%</small>`, BASIS[b]) +
      tile('日経225', fmt(last.nikkei), last.date);
  },
  columns: [
    { label: '日経225', value: r => r.nikkei, digits: 2 },
    { label: 'PER<br>加重平均', value: r => r.per_w, digits: 2, cls: v => { const s = perState(v); return s && s[0] !== 'mid' ? s[0] : ''; } },
    { label: 'PER<br>指数ベース', value: r => r.per_i, digits: 2 },
    { label: 'EPS(円)<br>加重平均', value: r => eps(r, 'w'), digits: 0 },
    { label: 'EPS(円)<br>指数ベース', value: r => eps(r, 'i'), digits: 0 },
    { label: '配当利回り(%)<br>加重平均', value: r => r.div_w, digits: 2 },
  ],
});
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日経225 25日移動平均乖離率</title>
<link rel="stylesheet" href="assets/style.css?v=11">
</head>
<body>
<main>
  <nav class="tabs"><a href="./">騰落レシオ</a><a href="sinyou.html">信用残</a><a href="saitei.html">裁定残</a><a href="per.html">PER</a><a href="pbr.html">PBR</a><a href="kokusai.html">国債金利</a><a href="kairi.html" aria-current="page">乖離率</a><a href="gyaku.html">逆イールド</a><a href="kaizan.html">買残比率</a></nav>
  <header>
    <h1>日経225 25日移動平均乖離率</h1>
    <p>日経225 終値と25日移動平均線との乖離（日次） · 終値の出典 <a href="https://nikkei225jp.com/data/per.php" target="_blank" rel="noopener">nikkei225jp.com</a> · 最終更新 <span id="updated">-</span></p>
  </header>

  <section class="tiles" id="tiles"></section>
  <p id="error"></p>

  <section class="card">
    <div class="controls">
      <div class="seg" id="basis" role="group" aria-label="計算方法" hidden>
        <button data-b="w" aria-pressed="true">加重平均</button><button data-b="i">指数ベース</button>
      </div>
      <div class="seg" id="range" role="group" aria-label="表示期間">
        <button data-m="3">3カ月</button><button data-m="12">1年</button><button data-m="36" aria-pressed="true">3年</button><button data-m="60">5年</button><button data-m="120">10年</button><button data-m="0">全期間</button>
      </div>
    </div>
    <div class="readout" id="readout"></div>
    <div id="charts"></div>
    <p class="note">25日移動平均乖離率 = (終値 − 25日移動平均) ÷ 25日移動平均 × 100。25日移動平均は直近25営業日の終値の単純平均です。日経平均では +5% 以上で買われすぎ（過熱）、−5% 以下で売られすぎの目安とされます。</p>
  </section>

  <section class="card">
    <div class="row-head">
      <h2>日次データ</h2>
      <span class="legend-note"><span class="chip" style="background:#d63b3a;color:#fff;font-weight:700">+5%以上 買われすぎ</span><span class="chip" style="background:#2a6fd0;color:#fff;font-weight:700">−5%以下 売られすぎ</span></span>
      <a href="#" id="csv">CSV をダウンロード</a>
    </div>
    <div class="table-wrap"><table id="table"></table></div>
    <p><button id="showAll" class="more" hidden>すべての日を表示</button></p>
  </section>
</main>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="assets/common.js?v=8"></script>
<script src="assets/valuation.js?v=8"></script>
<script>
const N = 25;
const HOT = 5, COLD = -5;
const kairiState = v => v == null ? null : v >= HOT ? ['hot', '買われすぎ'] : v <= COLD ? ['cold', '売られすぎ'] : ['mid', '中立'];
const ma = r => r.ma25;
const kairi = r => r.kairi25;
let allRows = [];
renderValuationPage({
  basisToggle: false,
  // 25営業日分の終値がそろった日から、移動平均と乖離率を計算する
  prepare: rows => {
    allRows = rows;
    const closes = [];
    let sum = 0;
    for (const r of rows) {
      if (r.nikkei == null) continue;
      closes.push(r.nikkei); sum += r.nikkei;
      if (closes.length > N) sum -= closes[closes.length - N - 1];
      if (closes.length < N) continue;
      r.ma25 = sum / N;
      r.kairi25 = (r.nikkei - r.ma25) / r.ma25 * 100;
    }
  },
  state: r => kairiState(kairi(r)),
  charts: [
    { id: 'kairiChart', title: '25日移動平均乖離率（%）', note: '点線: +5 / 0 / −5%', height: 280, digits: 2,
      lines: [{ label: '乖離率', unit: '%', color: '--series-1', width: 2, value: kairi }], refs: [{ v: HOT, color: '--hot' }, { v: 0, color: '--text-muted' }, { v: COLD, color: '--cold' }] },
    { id: 'nikkeiChart', title: '日経225 終値と25日移動平均<span class="toggles" style="display:inline-flex;margin-left:10px;font-weight:400"><span><span class="swatch" data-c="--nikkei"></span> 終値</span><span><span class="swatch" data-c="--series-2"></span> 25日平均</span></span>', height: 220, digits: 0,
      lines: [{ label: '日経', color: '--nikkei', value: r => r.nikkei }, { label: '25日平均', color: '--series-2', value: ma }] },
  ],
  tiles: (last, prev, b, tile) => {
    const v = kairi(last), st = kairiState(v);
    const d = v - kairi(prev);
    return tile('25日移動平均乖離率', `${pct(v)}${st ? `<span class="badge ${st[0]}">${st[1]}</span>` : ''}`, `${last.date} · 前日比 ${(d >= 0 ? '+' : '') + fmt(d)}pt`, true) +
      tile('日経225', fmt(last.nikkei), last.date) +
      tile('25日移動平均', fmt(ma(last)), `乖離幅 ${(last.nikkei - ma(last) >= 0 ? '+' : '') + fmt(last.nikkei - ma(last), 0)}円`) +
      tile('+5% になる日経平均', fmt(ma(last) * (1 + HOT / 100), 0), '25日平均 × 1.05（買われすぎの目安）') +
      tile('−5% になる日経平均', fmt(ma(last) * (1 + COLD / 100), 0), '25日平均 × 0.95（売られすぎの目安）');
  },
  columns: [
    { label: '日経225', value: r => r.nikkei, digits: 2 },
    { label: '25日<br>移動平均', value: ma, digits: 2 },
    { label: '乖離幅<br>(円)', value: r => r.ma25 == null ? null : r.nikkei - r.ma25, digits: 0 },
    { label: '乖離率<br>(%)', value: kairi, digits: 2, cls: v => { const s = kairiState(v); return s && s[0] !== 'mid' ? s[0] : ''; } },
  ],
});

// 計算した乖離率を CSV で保存する
document.getElementById('csv').addEventListener('click', e => {
  e.preventDefault();
  const lines = ['date,nikkei,ma25,kairi25'];
  for (const r of allRows) if (r.ma25 != null) lines.push([r.date, r.nikkei, r.ma25.toFixed(2), r.kairi25.toFixed(2)].join(','));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
  a.download = 'kairi25.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
